    model: Qwen/Qwen2.5-7B-Instruct
    temperature: 0.0
    max_output_tokens: 1024
    timeout_seconds: 300.0
    request_cost_ceiling: 0.002
defenses: [D4]
repetitions: 1
schedule_seed: 0
max_steps: 10
parse_retries: 2
confirm_high_risk: true
budget:
