live_enabled: true
endpoint_format_confirmed: true
cost_bounds_confirmed: true
task_root: <path-redacted>
manifest_mode: broad
task_pairs:
  - eval-calendar-recipient-multi_hop
  - eval-calendar-taint-multi_hop
  - eval-calendar-taint-plain
  - eval-email-read_scope-plain
  - eval-email-taint-plain
  - eval-file-read_scope-multi_hop
  - eval-file-resource-multi_hop
  - eval-file-taint-multi_hop
  - eval-file-taint-plain
  - eval-web-recipient-plain
  - eval-web-taint-multi_hop
  - eval-web-taint-plain
