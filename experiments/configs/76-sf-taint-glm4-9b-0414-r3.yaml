# #76 taint deep-dive, GLM lane round 3: the same 20 pairs, with the guard sized from
# measured demand. Round 2 needed ~1,160 requests for 200 episodes (GLM burns extra
# requests on format retries) but max_cost 15 CNY / ceiling 0.013 caps at 1,153 reserved
# requests, so it stalled at 172/200 and every resume exited immediately. Free tier: the
# real bill is CNY 0.00 either way; max_requests is the operative guard. New run directory
# because raising the budget changes the config fingerprint; r1/r2 partials are kept.
