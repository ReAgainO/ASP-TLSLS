# 60-pair teammate corpus on Qwen2.5-7B via SiliconFlow, D0 only (120 episodes).
# task_root is a local extract of <member-A> PR #79 tasks/expansion-v1 with two
# documented adaptations: family calendar->email / web->file, and 24 http_contains_facts
# checks dropped (this branch's schema has no such check type).
schema_version: 1
live_enabled: true
endpoint_format_confirmed: true
cost_bounds_confirmed: true
task_root: <path-redacted>
models:
  - name: qwen25-7b
    model: Qwen/Qwen2.5-7B-Instruct
    temperature: 0.0
    max_output_tokens: 1024
    timeout_seconds: 90.0
    request_cost_ceiling: 0.002
defenses: [D0]
repetitions: 1
schedule_seed: 0
max_steps: 10
parse_retries: 2
confirm_high_risk: true
budget:
  currency: CNY
  max_cost: 4.0
  max_requests: 1500
