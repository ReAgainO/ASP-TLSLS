# Model sweep at D0, five models (three free + two user-approved paid).
# 6 pairs x 2 variants x 5 models = 60 episodes. timeout 300 s for the free-tier queue.
# Paid ids per user instruction 2026-11: Qwen/Qwen2.5-14B-Instruct and
# tencent/Hunyuan-A13B-Instruct (the latter is time-priced 09:00-18:00).
schema_version: 1
live_enabled: true
endpoint_format_confirmed: true
cost_bounds_confirmed: true
task_root: tasks/expanded
task_pairs:
  - pilot-16-b64force
  - pilot-17-augment
  - pilot-22-planforgery
  - aig-06-preapproval
  - injec-amazon-dell-enh
  - sys-01-direct
models:
  - name: qwen3-8b
    model: Qwen/Qwen3-8B
    enable_thinking: false
    temperature: 0.0
    max_output_tokens: 1024
    timeout_seconds: 300.0
    request_cost_ceiling: 0.002
  - name: qwen35-4b
    model: Qwen/Qwen3.5-4B
    enable_thinking: false
    temperature: 0.0
    max_output_tokens: 1024
    timeout_seconds: 300.0
    request_cost_ceiling: 0.002
  - name: xing4-29b
    model: XingChenAGI/Xing4.0-29B
    temperature: 0.0
    max_output_tokens: 1024
    timeout_seconds: 300.0
    request_cost_ceiling: 0.002
  - name: qwen25-14b
    model: Qwen/Qwen2.5-14B-Instruct
    temperature: 0.0
    max_output_tokens: 1024
    timeout_seconds: 300.0
    request_cost_ceiling: 0.002
  - name: hunyuan-a13b
    model: tencent/Hunyuan-A13B-Instruct
    temperature: 0.0
    max_output_tokens: 1024
    timeout_seconds: 300.0
    request_cost_ceiling: 0.002
